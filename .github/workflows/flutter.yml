name: Flutter checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Check Android setup script
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Prepare project, analyze, test and build web
        run: bash scripts/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-web
          path: build/web
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Locate or install Android SDK
        run: bash scripts/setup_android_ci.sh
      - name: Build Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
