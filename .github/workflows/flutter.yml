name: Flutter checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare project, analyze, test and build web
        run: bash scripts/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-web
          path: build/web
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Configure the runner's Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          command -v sdkmanager
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..100})
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Build Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tvmaze-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
