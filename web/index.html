<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover television shows, explore casts and seasons, and save a personal watchlist. Powered by TVMaze.">
  <meta name="theme-color" content="#0c0d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TVMaze · Discover. Explore. Save.</title>
  <style>
    body { margin: 0; background: #0c0d16; color: #f5f3ff; font-family: system-ui, sans-serif; }
    #loading { display: grid; place-content: center; height: 100dvh; text-align: center; }
    #loading strong { color: #a78bfa; font-size: 32px; letter-spacing: -1px; }
    #loading p { color: #a5a6be; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>TVMaze</strong><p>Discover. Explore. Save.</p></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
